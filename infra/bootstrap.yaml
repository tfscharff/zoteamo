AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  zoteamo bootstrap: our own deploy bucket (objects deleted after 1 day, never versioned) and a $0.01 monthly
  cost budget that emails the owner. Separate from the main stack because packaging needs the bucket first.

Parameters:
  AlertEmail:
    Type: String
    Description: Address that receives the budget alert.

Resources:
  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub zoteamo-deploy-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-deploy-artifacts
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ZeroSpendBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: zoteamo-zero-spend
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 0.01
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  DeployBucketName:
    Value: !Ref DeployBucket
